name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan new commits for secrets (fails the build on any finding)
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS="$(command -v gitleaks || true)"
          if [ -z "$GITLEAKS" ]; then
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz -C /tmp gitleaks
            GITLEAKS=/tmp/gitleaks
          fi
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "$ZERO" ] || [ -z "${{ github.event.before }}" ]; then
            if git rev-parse -q --verify "origin/${{ github.event.repository.default_branch }}" >/dev/null; then
              RANGE="origin/${{ github.event.repository.default_branch }}..${{ github.sha }}"
            else
              RANGE="${{ github.sha }}"
            fi
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Scanning $RANGE"
          "$GITLEAKS" git . --log-opts="$RANGE" --redact --no-banner --exit-code 1
